[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pose2motion"
version = "0.1.0"
description = "Human pose estimation from video: filtering, jitter and accuracy metrics, and 3D skeleton"
requires-python = ">=3.10,<3.13"
dependencies = [
    "opencv-python",
    "mediapipe",
    "numpy",
    "scipy",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]